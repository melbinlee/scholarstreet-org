# Copies new Substack articles onto scholarstreet.org.
#
# On demand only: Actions tab -> "Sync Substack articles" -> "Run workflow".
# The commit it pushes is what deploys the site -- Netlify builds on every
# push to main.
#
# The weekly schedule was removed 2026-09-28. Substack's Cloudflare answers
# GitHub's runners with a 403, so every run since 2026-09-21 failed at the
# feed fetch. Articles are synced by hand instead, from a machine the feed
# does answer: python scripts/sync_substack.py, then commit and push.
name: Sync Substack articles

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-substack
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch feed and rebuild news pages
        run: python scripts/sync_substack.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A news news.html index.html sitemap.xml _redirects
          if git diff --cached --quiet; then
            echo "No new or changed articles."
            exit 0
          fi
          git commit -m "Sync articles from Substack"
          git push
